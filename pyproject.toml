[project]
name = "flo-pro-monorepo"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "amzn-flo-pro-sdk",
  "amzn-flo-pro-adk",
]

[project.optional-dependencies]
ray = ["amzn-flo-pro-sdk[ray]"]
dashboard = ["amzn-flo-pro-sdk[dashboard]"]
all = ["amzn-flo-pro-sdk[ray,dashboard]", "amzn-flo-pro-adk"]

[tool.uv.workspace]
members = ["python/flo-pro-sdk", "python/flo-pro-adk"]

[tool.uv.sources]
amzn-flo-pro-sdk = { workspace = true }
amzn-flo-pro-adk = { workspace = true }

[dependency-groups]
dev = [
  "pytest",
  "mypy",
  "ruff",
  "hypothesis",
  "mkdocs-material",
  "mkdocstrings[python]",
]
